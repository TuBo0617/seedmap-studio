name: build

# Mirrors the platform matrix the upstream Axolotl Launcher ships:
# Linux x64/arm64, Windows x64/arm64, macOS arm64/x64, plus the mobile
# targets: one universal Android APK covering all four ABIs and an
# unsigned iOS build (signing needs an Apple developer certificate).
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Which jobs to run"
        type: choice
        options: [all, ios, android, desktop]
        default: all
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.artifact }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'desktop' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            artifact: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: windows-x64
            cc: clang-cl
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            artifact: windows-arm64
            cc: clang-cl
          - os: macos-26
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-arm64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: macos-x64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsoup-3.0-dev

      # cubiomes uses C99 variable length arrays, which cl.exe rejects.
      # clang-cl drives the same MSVC toolchain but accepts them.
      - name: Select clang-cl for the C engine
        if: matrix.cc == 'clang-cl'
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvm) { $llvm | Out-File -Append $env:GITHUB_PATH }
          $target = "${{ matrix.target }}".Replace("-", "_")
          "CC_$target=clang-cl" | Out-File -Append $env:GITHUB_ENV
          "AR_$target=llvm-lib" | Out-File -Append $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build app and bundles
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**

  android:
    name: android-universal
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'android' }}
    runs-on: ubuntu-24.04
    env:
      # Four ABIs are compiled in one Gradle invocation; cap cargo's own
      # parallelism so the runner does not run out of memory.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # One Rust target per ABI, because the universal APK merges all four.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships the SDK, but `android-actions/setup-android`
      # is not used here: it still asks sdkmanager for the retired "tools"
      # package and aborts. The preinstalled cmdline-tools are enough.
      - name: Install NDK and platform
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      # src-tauri/gen/android is checked in (it carries the MainActivity
      # insets handling), so the project is not regenerated here.
      - name: Build universal APK (arm64-v8a, armeabi-v7a, x86, x86_64)
        run: pnpm tauri android build --apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-universal
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    name: ios-unsigned
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'ios' }}
    runs-on: macos-26
    env:
      # No signing certificate exists on CI; the CLI only needs a non-empty
      # team id to generate the Xcode project. The build itself runs with
      # `--no-sign`, so this value never reaches a provisioning profile.
      APPLE_DEVELOPMENT_TEAM: ABCDE12345
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ios

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      # `tauri ios init` shells out to XcodeGen, which the runner image
      # does not ship.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: pnpm tauri ios init --ci

      # No Apple certificate is available on CI, so the app is built
      # unsigned and packed into an .ipa that can be re-signed locally with
      # AltStore, Sideloadly or `codesign`.
      - name: Build unsigned app
        run: pnpm tauri ios build --target aarch64-apple-ios --no-sign

      - name: Collect unsigned ipa
        run: |
          mkdir -p out
          find src-tauri/gen/apple -name "*.ipa" -type f -exec cp {} out/ \;
          if [ -z "$(ls -A out)" ]; then
            echo "no ipa from the bundler, zipping the .app by hand"
            APP=$(find src-tauri/gen/apple -name "*.app" -type d | head -1)
            echo "app bundle: $APP"
            mkdir -p Payload && cp -R "$APP" Payload/
            zip -qry out/Seedmap-Studio-unsigned.ipa Payload
          fi
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          IPA=$(ls out/*.ipa | head -1)
          mv "$IPA" "out/Seedmap-Studio-${VERSION}-ios-unsigned.ipa"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          if-no-files-found: error
          path: out/*.ipa
