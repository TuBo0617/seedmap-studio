name: build

# Mirrors the platform matrix the upstream Axolotl Launcher ships:
# Linux x64/arm64, Windows x64/arm64, macOS arm64/x64.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            artifact: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: windows-x64
            cc: clang-cl
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            artifact: windows-arm64
            cc: clang-cl
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: macos-x64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsoup-3.0-dev

      # cubiomes uses C99 variable length arrays, which cl.exe rejects.
      # clang-cl drives the same MSVC toolchain but accepts them.
      - name: Select clang-cl for the C engine
        if: matrix.cc == 'clang-cl'
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvm) { $llvm | Out-File -Append $env:GITHUB_PATH }
          $target = "${{ matrix.target }}".Replace("-", "_")
          "CC_$target=clang-cl" | Out-File -Append $env:GITHUB_ENV
          "AR_$target=llvm-lib" | Out-File -Append $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build app and bundles
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
