[package]
name = "seedmap-studio"
version = "0.2.0"
description = "Standalone Minecraft seed map studio"
edition = "2024"

[lib]
name = "seedmap_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
seedmap-core = { path = "../crates/seedmap-core" }

[profile.dev]
incremental = true
