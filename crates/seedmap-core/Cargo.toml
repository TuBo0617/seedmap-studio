[package]
name = "seedmap-core"
version = "0.2.0"
edition = "2024"
description = "Minecraft world-generation engine for Seedmap Studio, powered by cubiomes"
license = "GPL-3.0-only"

[lib]
name = "seedmap_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quartz_nbt = { version = "0.2.9", features = ["serde"] }
flate2 = "1.1"

[build-dependencies]
cc = "1"
